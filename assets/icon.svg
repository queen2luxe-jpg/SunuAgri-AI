<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" stroke-dasharray="16 12"/>
  <!-- Sprout & Grain Icon -->
  <g transform="translate(106, 96)">
    <!-- Main stem -->
    <path d="M150 300 C150 200, 150 140, 150 80" stroke="#34d399" stroke-width="20" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M150 210 C80 190, 40 130, 60 70 C120 70, 150 140, 150 210 Z" fill="url(#gold)"/>
    <!-- Right Leaf -->
    <path d="M150 150 C220 130, 260 70, 240 10 C180 10, 150 80, 150 150 Z" fill="#6ee7b7"/>
    <!-- Ground seeds -->
    <circle cx="90" cy="295" r="14" fill="#fbbf24"/>
    <circle cx="150" cy="305" r="16" fill="#34d399"/>
    <circle cx="210" cy="295" r="14" fill="#fbbf24"/>
  </g>
</svg>
